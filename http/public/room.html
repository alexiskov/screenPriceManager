  <script>
    (function () {
      const AUTO_ADVANCE_MS = 10_000; // 10 секунд

      const roomTitleEl = document.getElementById('roomTitle');
      const galleryGrid = document.getElementById('galleryGrid');
      const fsBackdrop = document.getElementById('fsBackdrop');
      const fsImage = document.getElementById('fsImage');

      let currentSlots = [];
      let blobUrls = {};
      let MOCK_MODE = false;

      let fsIndex = 0;
      let fsTimer = null;

      // Извлекаем ID из URL
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const roomId = pathSegments[pathSegments.length - 1];

      if (!roomId || isNaN(roomId)) {
        roomTitleEl.textContent = 'Ошибка';
        galleryGrid.innerHTML = `<div class="error-state"><p>ID комнаты не найден в URL.</p></div>`;
        return;
      }

      // --- Mock данные ---
      const mockRooms = [{ id: 1, title: 'ТЦ «Центральный»' }, { id: 2, title: 'ТЦ «Северный»' }];
      const svgTile = (color, label) => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="${color}"/><text x="300" y="315" font-size="48" text-anchor="middle" fill="white" font-family="sans-serif">${label}</text></svg>`)}`;
      const mockSlots = {
        1: [ { id: 101, image_url: svgTile('#3b82f6', '1') }, { id: 102, image_url: svgTile('#8b5cf6', '2') }, { id: 103, image_url: svgTile('#ec4899', '3') } ],
        2: [ { id: 201, image_url: svgTile('#f59e0b', '1') } ]
      };

      // --- API ---
      async function apiFetch(url) {
        if (MOCK_MODE) return mockFetch(url);
        try {
          const res = await fetch(url, { credentials: 'same-origin' });
          if (!res.ok) throw new Error('Network error');
          return await res.json();
        } catch (err) {
          MOCK_MODE = true;
          return mockFetch(url);
        }
      }

      async function mockFetch(url) {
        await new Promise(r => setTimeout(r, 300));
        const m = url.match(/^\/api\/rooms\/(\d+)$/);
        if (m) {
          const id = Number(m[1]);
          const room = mockRooms.find(r => r.id === id);
          if (!room) throw new Error('Room not found');
          return { ...room, slots: mockSlots[id] || [] };
        }
        throw new Error('Mock: unknown');
      }

      // --- Отрисовка ---
      function clearBlobUrls() {
        Object.values(blobUrls).forEach(url => URL.revokeObjectURL(url));
        blobUrls = {};
      }

      async function loadData() {
        try {
          const room = await apiFetch(`/api/rooms/${roomId}`);
          document.title = room.title;
          roomTitleEl.textContent = room.title;

          currentSlots = Array.isArray(room.slots) ? room.slots.filter(s => s.image_url) : [];

          galleryGrid.innerHTML = '';
          clearBlobUrls();

          if (currentSlots.length === 0) {
            galleryGrid.innerHTML = `<div class="empty-state"><p>В этой точке пока нет изображений.</p></div>`;
            return;
          }

          currentSlots.forEach((slot, index) => {
            const tile = document.createElement('div');
            tile.className = 'tile';

            if (slot.image_url.startsWith('data:')) {
              const img = document.createElement('img');
              img.src = slot.image_url;
              tile.appendChild(img);
            } else {
              fetch(slot.image_url)
                .then(res => res.blob())
                .then(blob => {
                  const objectUrl = URL.createObjectURL(blob);
                  blobUrls[slot.id] = objectUrl;
                  const img = document.createElement('img');
                  img.src = objectUrl;
                  tile.appendChild(img);
                })
                .catch(err => console.error('Blob fetch error:', err));
            }

            // Передаем Event (e) в функцию
            tile.addEventListener('click', (e) => openFullscreen(index, e));
            galleryGrid.appendChild(tile);
          });

        } catch (err) {
          roomTitleEl.textContent = 'Ошибка';
          galleryGrid.innerHTML = `<div class="error-state"><p>Ошибка загрузки: ${err.message}</p></div>`;
        }
      }

      // --- Fullscreen логика ---

      function openFullscreen(startIndex, event) {
        if (currentSlots.length === 0) return;
        fsIndex = startIndex;
        fsBackdrop.classList.add('open');

        showFsImage();
        startSlideTimer();

        // Запрос на нативный Fullscreen (как F11)
        // Вызывается только по клику пользователя
        if (fsBackdrop.requestFullscreen) {
          fsBackdrop.requestFullscreen().catch(err => {
            console.warn(`Fullscreen error: ${err.message}`);
          });
        } else if (fsBackdrop.webkitRequestFullscreen) { /* Safari */
          fsBackdrop.webkitRequestFullscreen();
        } else if (fsBackdrop.msRequestFullscreen) { /* IE11 */
          fsBackdrop.msRequestFullscreen();
        }
      }

      function closeFullscreen() {
        fsBackdrop.classList.remove('open');
        stopSlideTimer();

        // Выход из нативного фулскрина
        if (document.fullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => console.warn(err));
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      }

      function showFsImage() {
        const slot = currentSlots[fsIndex];
        if (!slot) return;

        if (slot.image_url.startsWith('data:')) {
          fsImage.src = slot.image_url;
        } else if (blobUrls[slot.id]) {
          fsImage.src = blobUrls[slot.id];
        }
      }

      function nextSlide() {
        if (currentSlots.length === 0) return;
        fsIndex = (fsIndex + 1) % currentSlots.length;
        showFsImage();
        resetSlideTimer();
      }

      function startSlideTimer() {
        stopSlideTimer();
        fsTimer = setTimeout(nextSlide, AUTO_ADVANCE_MS);
      }

      function stopSlideTimer() {
        if (fsTimer) { clearTimeout(fsTimer); fsTimer = null; }
      }

      function resetSlideTimer() {
        stopSlideTimer();
        startSlideTimer();
      }

      // --- События ---

      // Клик по картинке в фулскрине — выход
      fsBackdrop.addEventListener('click', () => {
        closeFullscreen();
      });

      // Если пользователь нажал Esc (выход из Fullscreen API),
      // нужно синхронизировать состояние и убрать черный фон
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          // Если фулскрин закрыт, скрываем наш backdrop
          fsBackdrop.classList.remove('open');
          stopSlideTimer();
        }
      });

      // Запуск
      loadData();
    })();
  </script>
