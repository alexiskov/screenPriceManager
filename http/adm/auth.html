<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аутентификация | Вход в систему</title>
  <!-- Простые, но приятные глазу стили -->
  <style>
    /* Сброс и базовые настройки */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f5f7fa 0%, #e9edf2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Карточка аутентификации */
    .auth-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem 2.2rem;
      border-radius: 2rem;
      box-shadow:
        0 20px 40px -12px rgba(0, 20, 30, 0.25),
        0 8px 24px -8px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease;
    }

    .auth-card:hover {
      transform: scale(1.01);
    }

    /* Заголовок */
    .auth-title {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a1e2c;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.95rem;
      color: #4b5e6b;
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 1.2rem;
    }

    /* Группы полей */
    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #1f3a4b;
      margin-bottom: 0.45rem;
      padding-left: 0.25rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1.1rem;
      font-size: 1rem;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 1rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      color: #0a1e2c;
    }

    .input-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .input-group input::placeholder {
      color: #9aa9b5;
      font-weight: 300;
      font-size: 0.95rem;
    }

    /* Кнопка отправки */
    .submit-btn {
      width: 100%;
      padding: 0.95rem;
      background: #0a1e2c;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 14px -6px rgba(10, 30, 44, 0.4);
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      background: #132f42;
      box-shadow: 0 10px 20px -8px rgba(10, 30, 44, 0.5);
    }

    .submit-btn:active {
      transform: scale(0.98);
      background: #071520;
      box-shadow: 0 3px 8px -4px rgba(0, 0, 0, 0.5);
    }

    /* Декоративная нижняя часть */
    .form-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #7a8b99;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      padding-top: 1.2rem;
    }

    /* Адаптив для очень маленьких экранов */
    @media (max-width: 400px) {
      .auth-card {
        padding: 1.8rem 1.2rem;
        border-radius: 1.5rem;
      }
      .auth-title {
        font-size: 1.7rem;
      }
    }

    /* Поддержка тёмной темы (автоматически) */
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(145deg, #101c26 0%, #0b141c 100%);
      }
      .auth-card {
        background: rgba(20, 32, 40, 0.9);
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
      }
      .auth-title {
        color: #e5edf5;
      }
      .auth-subtitle {
        color: #9bb1c2;
        border-bottom-color: rgba(255, 255, 255, 0.08);
      }
      .input-group label {
        color: #b8d0e0;
      }
      .input-group input {
        background: #1a2a36;
        border-color: #2e4554;
        color: #eef4f8;
      }
      .input-group input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
      }
      .input-group input::placeholder {
        color: #6a8396;
      }
      .submit-btn {
        background: #2563eb;
        box-shadow: 0 6px 14px -6px #1e3a8a;
      }
      .submit-btn:hover {
        background: #3b82f6;
      }
      .form-footer {
        color: #6c8397;
        border-top-color: rgba(255, 255, 255, 0.08);
      }
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1 class="auth-title">Вход</h1>
    <p class="auth-subtitle">Введите учётные данные для доступа</p>

    <!-- Форма аутентификации: отправка POST на /adm/ -->
    <form action="/auth/check" method="post" autocomplete="off">
      <!-- Поле логина -->
      <div class="input-group">
        <label for="login">Логин</label>
        <input
          type="text"
          id="login"
          name="login"
          placeholder="например, admin"
          required
          autofocus
          aria-label="Логин"
        >
      </div>

      <!-- Поле пароля -->
      <div class="input-group">
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          aria-label="Пароль"
        >
      </div>

      <!-- Кнопка отправки -->
      <button type="submit" class="submit-btn">Войти</button>
    </form>

    <div class="form-footer">
      Защищённое соединение
    </div>
  </div>
</body>
</html>
